# Local-only DocDuck Indexer Configuration
# AI Configuration is now managed via admin API or environment variables
# Set OPENAI_API_KEY for automatic seeding on first run

Database:
  ConnectionString: "Host=postgres;Database=docduck;Username=docduck;Password=docduck123"

Chunking:
  ChunkSize: 500
  ChunkOverlap: 50
  CleanupOrphanedDocuments: true
  ForceFullReindex: false

Providers:
  Local:
    Enabled: true
    Name: "LocalFiles"
    RootPath: "/data/documents"
    Recursive: true
    FileExtensions:
      - ".docx"
      - ".pdf"
      - ".txt"
    ExcludePatterns:
      - ".git"
      - "node_modules"
      - "__pycache__"

  OneDrive:
    Enabled: false
  S3:
    Enabled: false
